services:
  frekvens-tilladelse:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ATOLL_CLIENT_ID: ${ATOLL_CLIENT_ID:?sæt ATOLL_CLIENT_ID i .env}
      ATOLL_CLIENT_SECRET: ${ATOLL_CLIENT_SECRET:?sæt ATOLL_CLIENT_SECRET i .env}
    volumes:
      - permit-data:/app/data

volumes:
  permit-data:
